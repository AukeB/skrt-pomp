[project]
name = "skrt-pomp"
version = "0.1.0"
description = "Creating chiptune music with Python, inspired by old video game consoles such as the NES."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "docstring-tailor>=0.4.1",
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.6",
    "ty>=0.0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skrt_pomp"]

[tool.deptry]
known_first_party = ["skrt_pomp"]

[tool.ruff.lint]
select = [
    "I",    # isort-style import sorting
    "ANN",  # annotation rules
]

[tool.ruff.lint.isort]
known-first-party = ["skrt_pomp"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.docstring_tailor]
line-length = 80
style = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "I001"]  # tests are not held to annotation rules; two blank lines separate imports from section comments
